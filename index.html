<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>face swap</title>
  
  <!-- Google Fonts: Noto Sans TC (繁體中文) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <!-- 全局配置 - 可在打包後直接修改 -->
  <script>
    // ===== API 配置 =====
    // 這些配置可以在打包後的 dist 目錄中直接修改
    window.endpoint = {
      // API 基礎 URL - sport115ntp 測試機
      baseURL: 'https://line.uat.sport115ntp.aitago.tw/api',
      // 圖片上傳 API，請填入後端實際提供的完整 URL；未設定時會退回本機下載
      uploadImageUrl: '',
      // 或者只提供相對路徑，下載發送流程走檔案上傳端點
      uploadImagePath: 'face-swap/files',
      // 本地測試是否也強制走上傳 API（true: localhost 也打 API）
      forceUploadOnLocal: true,
      // 若上傳 API 回傳 task_id，會用此模板輪詢最終圖片 URL
      uploadStatusUrl: 'https://line.uat.sport115ntp.aitago.tw/api/face-swap/status/{taskId}',
      // face-swap API 需要 template_id，先用預設 1
      uploadTemplateId: '1',
      // 認證 Token（開發 / 測試先寫死，之後可改成環境變數）
      authToken: '123',
      // 請求超時時間（毫秒）
      timeout: 30000,
      // 調試模式 - 設為 true 可以在控制台看到詳細日誌
      debug: true,
      
      // ===== LIFF 配置 =====
      // LIFF ID - sport115ntp 活動專用（之後可再依實際調整）
      liffId: '2008136985-QEKHLgux',
      // LINE Basic ID - 修改這裡來改變 LINE 官方帳號 ID
      basicId: '@299fvzdf',
      // 是否啟用 LIFF 功能
      enableLiff: true,
      // 測試用 userId（本地 / Vercel 測試會優先使用）
      // 建議維持 dev_user_ 開頭，方便在前端放寬限制
      testUserId: 'dev_user_sport115ntp_001'
    };
    
    // 輸出配置到控制台（如果啟用調試模式）
    if (window.endpoint.debug) {
      console.log('🔧 當前 API 配置:', window.endpoint);
      
      // 檢查是否在開發環境
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        console.log('🌐 檢測到本地開發環境');
        if (!window.endpoint.enableLiff) {
          console.log('🔧 開發模式：LIFF 功能已關閉');
          console.log('💡 現在可以測試圖片生成功能而不會觸發 LIFF 錯誤');
        }
      }
      
    }
  </script>
  
  <script type="module" src="/resources/js/app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #333333;
      min-height: 100vh;
      font-family: "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    
    #vue-root {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="vue-root" data-component="FaceSwapApp"></div>
</body>
</html>
